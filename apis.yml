aid: topl
name: Topl
description: 'Topl was an impact-technology company founded in 2017 out of Rice University and based in
  Houston, Texas, building a proof-of-stake blockchain that let organizations prove ethical and sustainable
  practices on-ledger. It raised a $3M seed in 2020 and a $15M Series A in 2022, and shipped a real developer
  platform: the Bifrost node, the Genus indexer, the Brambl SDK family for Scala, TypeScript, JavaScript
  and Dart, and the brambl-cli client. In late 2023 the company rebranded to Apparatus and repositioned
  around Thunder, a Bitcoin Layer 2. It appears to have wound down after that — the last first-party artifact
  of any kind shipped on 2024-09-26, all ten remaining public repositories are archived, every documentation
  and API host now fails to resolve, and the topl.co domain lapsed and was re-registered by an unrelated
  owner on 2024-12-30. What survives, and what this profile is built from, is the contract itself: a 38-file
  proto3 module defining 6 gRPC services, 30 RPCs and 138 messages, still downloadable from the Buf Schema
  Registry, plus the published SDKs and container images.'
