transaction_authorization:
  model: Quivr propositions and proofs
  description: >-
    Every transaction output is locked by a Proposition and spent by supplying a matching
    Proof, carried in an Attestation. This is the real access control in the system: reads are
    open, writes are gated by possession of a key that satisfies the lock.
  contract_locations:
  - grpc/quivr/models/proposition.proto
  - grpc/quivr/models/proof.proto
  - grpc/brambl/models/box/attestation.proto
  - grpc/brambl/models/box/lock.proto
  - grpc/brambl/models/box/challenge.proto
